repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Local hook rather than mirrors-mypy: that one builds an isolated venv
  # without homeassistant installed, so every HA symbol resolves to Any and
  # disallow_subclassing_any, warn_return_any and friends check nothing.
  # Running from the project venv is what core does too. pass_filenames is
  # false because with follow_imports = normal a partial file list gives mypy
  # an incomplete view of the package and results vary per commit.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy custom_components/migo_netatmo
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
        files: ^custom_components/

  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
      - id: codespell
        # "hass" is the Home Assistant core object name, not a typo of "hash".
        args: [--skip, "*.json,*.lock", --ignore-words-list, "hass"]
