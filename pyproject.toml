[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-migo-netatmo"
# Kept in sync with custom_components/migo_netatmo/manifest.json (source of
# truth) at every "chore: prepare release" commit and re-stamped by
# .github/workflows/release.yaml when a release is published.
version = "0.41.0"
description = "Home Assistant integration for MiGO Netatmo thermostats"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13.2"
authors = [
    {name = "tomahoax"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiohttp>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "homeassistant>=2025.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-homeassistant-custom-component>=0.13.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
    "mypy>=1.13.0",
]

[project.urls]
Homepage = "https://github.com/tomahoax/ha-migo-netatmo"
Documentation = "https://github.com/tomahoax/ha-migo-netatmo"
Repository = "https://github.com/tomahoax/ha-migo-netatmo"
Issues = "https://github.com/tomahoax/ha-migo-netatmo/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components*"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # Pylint
    "RUF",    # Ruff-specific rules
]
ignore = [
    "PLR0913",  # Too many arguments
    "PLR0917",  # Too many positional arguments
    "PLR2004",  # Magic value in comparison
    "PLR0911",  # Too many return statements
    "PLR0912",  # Too many branches
    "PLR0915",  # Too many statements
    "RUF012",   # Mutable class attributes - HA uses this pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.migo_netatmo"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
follow_imports = "silent"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
# warn_return_any is intentionally left off: this integration parses loosely
# typed JSON from a third-party API, so `dict[str, Any].get(...)` naturally
# returns Any at most read sites. Turning it on surfaces ~25 no-any-return
# findings that would mostly need speculative casts rather than real bug
# fixes; tracked as a follow-up (see quality_scale.yaml strict-typing).
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "homeassistant.*",
    "voluptuous.*",
    "aiohttp.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["custom_components/migo_netatmo"]
omit = ["tests/*"]

[tool.coverage.report]
# Floor set below the coverage actually measured on 2026-07-24 (94.7%,
# essentially at the Silver test-coverage target of >95% in
# quality_scale.yaml), leaving headroom for normal fluctuation while still
# blocking real regressions. Raise this value as coverage improves further;
# do not lower it to make a failing PR pass.
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
