[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-migo-netatmo"
# Kept in sync with custom_components/migo_netatmo/manifest.json (source of
# truth) at every "chore: prepare release" commit and re-stamped by
# .github/workflows/release.yaml when a release is published.
version = "0.41.0"
description = "Home Assistant integration for MiGO Netatmo thermostats"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13.2"
authors = [
    {name = "tomahoax"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiohttp>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "homeassistant>=2025.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-homeassistant-custom-component>=0.13.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
    # Pinned, not floored: the mypy config mirrors Home Assistant core's and
    # uses keys such as strict_bytes that only exist in mypy 2.x, and mypy
    # hard-fails on an unrecognised config key. Pinning also keeps the
    # pre-commit hook and the CI job on the same checker.
    "mypy==2.3.0",
]

[project.urls]
Homepage = "https://github.com/tomahoax/ha-migo-netatmo"
Documentation = "https://github.com/tomahoax/ha-migo-netatmo"
Repository = "https://github.com/tomahoax/ha-migo-netatmo"
Issues = "https://github.com/tomahoax/ha-migo-netatmo/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components*"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # Pylint
    "RUF",    # Ruff-specific rules
]
ignore = [
    "PLR0913",  # Too many arguments
    "PLR0917",  # Too many positional arguments
    "PLR2004",  # Magic value in comparison
    "PLR0911",  # Too many return statements
    "PLR0912",  # Too many branches
    "PLR0915",  # Too many statements
    "RUF012",   # Mutable class attributes - HA uses this pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.migo_netatmo"]

[tool.mypy]
# Mirrors the mypy.ini that Home Assistant core generates for an integration
# listed in .strict-typing. The first group is core's GENERAL_SETTINGS, the
# second its STRICT_SETTINGS, both from script/hassfest/mypy_config.py.
# Deliberate divergences:
#   - "plugins" is omitted (pydantic.mypy and mypy_plugins/
#     enum_identity_compare.py are not reproducible outside the core repo, and
#     neither applies here: no pydantic models, no enum identity comparisons).
#   - "native_parser" and "num_workers" are omitted: performance only.
# Note there is deliberately no ignore_missing_imports and no per-module
# override: homeassistant, aiohttp and voluptuous all ship py.typed, and
# disable_error_code below is core's own safety net for untyped dependencies.
python_version = "3.13"
platform = "linux"
show_error_codes = true
follow_imports = "normal"
local_partial_types = true
strict_equality = true
strict_bytes = true
no_implicit_optional = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
extra_checks = false
enable_error_code = [
    "deprecated",
    "explicit-override",
    "ignore-without-code",
    "redundant-self",
    "truthy-iterable",
]
disable_error_code = [
    "annotation-unchecked",
    "import-not-found",
    "import-untyped",
]

# STRICT_SETTINGS: core applies these per-module to integrations listed in
# .strict-typing. This repository holds a single integration, so they are
# global. warn_return_any is the last one to be switched on, once the
# remaining no-any-return sites are narrowed (see quality_scale.yaml).
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
warn_unreachable = true
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["custom_components/migo_netatmo"]
omit = ["tests/*"]

[tool.coverage.report]
# Floor set below the coverage actually measured on 2026-07-24 (94.7%,
# essentially at the Silver test-coverage target of >95% in
# quality_scale.yaml), leaving headroom for normal fluctuation while still
# blocking real regressions. Raise this value as coverage improves further;
# do not lower it to make a failing PR pass.
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
