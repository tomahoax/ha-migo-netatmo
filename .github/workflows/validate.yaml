name: Validate

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  # hacs/action and hassfest both track a moving branch, so their rules can
  # change without a commit here. A weekly run surfaces that before it blocks a
  # release or a default-store submission.
  schedule:
    - cron: "0 6 * * 1"

# Declared explicitly rather than relying on the repository-wide default:
# this workflow runs third-party actions and, on pull requests, arbitrary
# contributor code. Neither should ever sit next to a write token.
permissions:
  contents: read

env:
  DEFAULT_PYTHON: "3.14"

jobs:
  validate-hacs:
    name: Validate HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # `ignore: brands` must be REMOVED before submitting to the HACS default
      # store: inclusion requires this action to pass "without any errors or
      # ignores". It cannot be removed yet, because the check needs an
      # icon.png under custom_integrations/migo_netatmo/ in
      # home-assistant/brands, and that entry does not exist. See
      # docs/development/publishing.md for the ordering.
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # The home-assistant/brands submission for this integration
          # (home-assistant/brands#8958) was rejected on substance (wrong
          # logo) and hasn't been resubmitted. HACS validates brand assets
          # against that external repo, not against the self-hosted
          # custom_components/migo_netatmo/brand/ folder (which is correct
          # for the running app - see docs/development/publishing.md on the
          # dev branch), so this ignore has to stay until a corrected PR
          # merges there.
          ignore: brands

  validate-hassfest:
    name: Validate hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.0"

      - name: Run Ruff linter
        run: ruff check custom_components/migo_netatmo

      - name: Run Ruff formatter check
        run: ruff format --check custom_components/migo_netatmo

  mypy:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # uv rather than pip so the job resolves from uv.lock, exactly like the
      # pre-commit hook, instead of doing a fresh resolve on every run.
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run mypy
        run: uv run --frozen mypy custom_components/migo_netatmo

  test:
    name: Test (Python ${{ matrix.python-version }}, HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest HA on the newest supported Python
          - python-version: "3.14"
            ha: "latest"
          # Minimum supported HA (matches hacs.json), pinned via the
          # pytest-homeassistant-custom-component release for HA 2026.9.
          # No older Python is left to pair it with: HA 2026.9.2 itself
          # requires Python >=3.14.2.
          - python-version: "3.14"
            ha: "2026.9"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      # --frozen resolves from uv.lock, which pins every package with a sha256.
      # The previous `pip install -e ".[dev]"` did a fresh unhashed resolve of
      # floored constraints on every run, which is the largest dependency
      # install in the repo and had no integrity guarantee at all.
      - name: Install dependencies from the lockfile
        run: uv sync --frozen --extra dev

      - name: Pin Home Assistant to minimum supported version
        if: matrix.ha == '2026.9'
        # This leg deliberately steps below the lockfile: pinning HA down is its
        # entire purpose, so it cannot itself be locked. Everything else still
        # comes from uv.lock. No extra pycares/aiodns pin needed here (unlike the
        # HA 2025.8 leg this replaced): this release resolves the same aiodns
        # 4.0.4 / pycares 5.0.1 pair as the "latest" leg, re-verified empirically
        # rather than assumed - re-check this note at the next floor bump.
        run: uv pip install "pytest-homeassistant-custom-component==0.13.365"

      - name: Run tests with pytest
        run: |
          uv run --no-sync pytest tests/ \
            -v \
            --cov=custom_components/migo_netatmo \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.ha == 'latest'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
