name: Validate

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  DEFAULT_PYTHON: "3.14"

jobs:
  validate-hacs:
    name: Validate HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  validate-hassfest:
    name: Validate hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.0"

      - name: Run Ruff linter
        run: ruff check custom_components/migo_netatmo

      - name: Run Ruff formatter check
        run: ruff format --check custom_components/migo_netatmo

  mypy:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy
        run: mypy custom_components/migo_netatmo

  test:
    name: Test (Python ${{ matrix.python-version }}, HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest HA on the newest supported Python
          - python-version: "3.14"
            ha: "latest"
          # Minimum supported HA (matches hacs.json), pinned via the
          # pytest-homeassistant-custom-component release for HA 2025.8
          - python-version: "3.13"
            ha: "2025.8"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pin Home Assistant to minimum supported version
        if: matrix.ha == '2025.8'
        # pycares<5: pycares 5.0 (2025-12) drops the API used by the
        # aiodns 3.5.0 release that HA 2025.8 pins
        run: pip install "pytest-homeassistant-custom-component==0.13.270" "pycares<5"

      - name: Run tests with pytest
        run: |
          pytest tests/ \
            -v \
            --cov=custom_components/migo_netatmo \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.ha == 'latest'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
