name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Validate before stamping. A tag that is not a version is a mistake, and
      # the old sed-based stamping turned some of them into a silently corrupt
      # manifest.json that shipped and failed to load for every user.
      - name: Validate the tag is a version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$GITHUB_REF' is not a vMAJOR.MINOR.PATCH[-prerelease] version"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Stamped with Python, not sed. sed's replacement grammar treats "&" as
      # "the whole match" and does not mind an unbalanced quote, so a tag
      # containing either produced invalid JSON and still exited 0. Parsing and
      # re-serialising makes that class of corruption impossible, and asserting
      # the value afterwards makes any remaining surprise a failed release
      # rather than a broken download.
      - name: Update version in manifest.json and pyproject.toml
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]

          manifest_path = pathlib.Path("custom_components/migo_netatmo/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          manifest["version"] = version
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")

          # Read back through the parser: proves the shipped file is valid JSON.
          assert json.loads(manifest_path.read_text())["version"] == version

          pyproject_path = pathlib.Path("pyproject.toml")
          pyproject, count = re.subn(
              r'^version = ".*"$',
              f'version = "{version}"',
              pyproject_path.read_text(),
              count=1,
              flags=re.MULTILINE,
          )
          assert count == 1, "no version line found in pyproject.toml"
          pyproject_path.write_text(pyproject)

          print(f"Stamped version {version}")
          PY

      # HACS extracts a zip_release archive straight into
      # config/custom_components/<domain>/ (zip_file.extractall(content.path.local)),
      # so the files must sit at the archive root. Zipping the directory itself
      # would nest them one level deeper and the integration would not load.
      - name: Create release archive
        run: |
          cd custom_components/migo_netatmo
          zip -r ../../migo_netatmo.zip . -x '__pycache__/*' -x '*/__pycache__/*'

      # The tag goes through env, never interpolated into the shell. A ${{ }}
      # expression is substituted textually before bash parses the line, so the
      # surrounding quotes give no protection and a crafted tag name would run
      # as shell in a job holding a contents:write token.
      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" ./migo_netatmo.zip
